# =============================================================================
# BachelorProject - Docker Compose for F1Tenth ROS2 Humble
# =============================================================================
# Usage:
#   docker compose build          # Build the image
#   docker compose up              # Launch the simulation
#   docker compose run --rm f1tenth bash   # Open an interactive shell
# =============================================================================

services:
  f1tenth:
    build:
      context: ..
      dockerfile: humbleDocker/Dockerfile
    image: f1tenth-humble:latest
    container_name: f1tenth-humble

    # Allow GUI (rviz2) to connect to host X server
    #
    # For Docker Desktop on Linux, run this on the host first:
    #   xhost +local:docker
    #   socat TCP-LISTEN:6000,reuseaddr,fork UNIX-CONNECT:/tmp/.X11-unix/X0 &
    # Then use: DISPLAY=host.docker.internal:0
    environment:
      - DISPLAY=host.docker.internal:0
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=42
      - QT_QPA_PLATFORM=xcb
      - XAUTHORITY=/root/.Xauthority
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Xauthority for display access
      - ${XAUTHORITY:-${HOME}/.Xauthority}:/root/.Xauthority:ro
      # Mount source code for live editing (optional — remove for production)
      - ../f1tenth_control:/ros2_ws/src/f1tenth_control
      - ../f1tenth_planning:/ros2_ws/src/f1tenth_planning
      - ../f1tenth_localization:/ros2_ws/src/f1tenth_localization
      - ../f1tenth_sim:/ros2_ws/src/f1tenth_sim
      - ../f1tenth_communication:/ros2_ws/src/f1tenth_communication
      - ../f1tenth_parameters:/ros2_ws/src/f1tenth_parameters
      - ../MPC:/ros2_ws/src/MPC
    network_mode: host
    stdin_open: true
    tty: true

    # Default command: launch the simulation
    command: >
      bash -c "
        echo '=== F1Tenth ROS2 Humble Container ==='
        echo 'Rebuilding workspace with local sources...'
        cd /ros2_ws &&
        source /opt/ros/humble/setup.bash &&
        colcon build --symlink-install --cmake-args -DCMAKE_BUILD_TYPE=Release &&
        source install/setup.bash &&
        echo '' &&
        echo 'Ready! Launching simulation...' &&
        ros2 launch f1tenth_gym_ros gym_bridge_launch.py
      "
