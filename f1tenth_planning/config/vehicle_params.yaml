# Vehicle Parameters for F1Tenth Racing Line Optimization
# These values are from the f1tenth_gym simulation environment
# Source: F110Env.f1tenth_vehicle_params()

vehicle:
  # Physical dimensions
  wheelbase: 0.324          # [m] Distance between front and rear axles
  width: 0.273                # [m] Total car width (for safety margin)
  
  # Tire/friction properties
  friction_coeff: 0.787      # [-] Tire-road friction coefficient (μ)
  
  # Acceleration limits
  max_acceleration: 8.0     # [m/s²] Maximum longitudinal acceleration
  max_deceleration: 7.7     # [m/s²] Maximum braking deceleration
  
  # Speed limits
  max_speed: 5.0            # [m/s] Maximum vehicle speed

optimization:
  # Track boundary safety margin (half car width + buffer)
  safety_margin: 0.20       # [m] Distance to keep from track edges
  
  # Direction of travel along the raceline
  # 'ccw' = counter-clockwise (default), 'cw' = clockwise
  direction: cw

# Additional vehicle properties (for reference, not currently used in optimization)
# These are kept for documentation and future advanced features
advanced:
  # Detailed dimensions
  lf: 0.169                # [m] CG to front axle
  lr: 0.155                # [m] CG to rear axle
  length: 0.53               # [m] Total car length
  
  # Mass properties
  mass: 3.314                 # [kg] Total vehicle mass
  inertia: 0.035           # [kg·m²] Yaw moment of inertia (I_z)
  cg_height: 0.074           # [m] Center of gravity height
  
  # Tire cornering stiffness (for dynamic models)
  C_Sf: 1.71                # [1/rad] Front cornering stiffness (C_af/(m*g))
  C_Sr: 1.30                # [1/rad] Rear cornering stiffness (C_ar/(m*g))
  # Note: C_Sf > C_Sr; car understeers (K_us = 0.012)
  
  # Rolling resistance (for trajectory optimizer mintime mode)
  c_roll: 0.163               # [-] Rolling resistance coefficient (measured coast-down 2025-03-11)
  
  # Steering constraints  
  max_steering_angle: 0.4189 # [rad] Maximum steering angle (~24°, calibrated with polynomial correction)
  max_steering_rate: 2.8492     # [rad/s] Maximum steering rate
