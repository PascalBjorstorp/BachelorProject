# MPC Hardware Node Configuration
# Parameters for the F1/10th MPC controller on real hardware
# These can be overridden via environment variables at runtime

mpc_hardware_node:
  ros__parameters:
    # Topic configuration
    odom_topic: "/ego_racecar/odom"                     # VESC odometry topic
    drive_topic: "/drive"                               # Ackermann mux input topic
    servo_topic: "/sensors/servo_position_command"      # VESC servo feedback topic
    imu_topic: "/imu/filtered_angular_velocity"         # Filtered yaw rate topic

    # Trajectory file (absolute path on the Jetson)
    trajectory_file: "/home/f1tenth/BachelorProject/f1tenth_planning/trajectories/my_track_raceline.csv"           # Set via launch file or MPC_TRAJECTORY_FILE env

    # Speed control
    speed_gain: 1.0               # Scale factor for trajectory velocities (0.0-2.0)
    max_velocity: 20.0            # Maximum reference velocity [m/s]

    # Timer-driven control rate
    control_rate_hz: 200.0        # MPC computation rate [Hz]

    # Safety watchdog
    watchdog_timeout_sec: 0.2     # Zero command if no odom for this long [seconds]

    # VESC servo conversion parameters
    # servo_val = steering_to_servo_gain * delta + steering_to_servo_offset
    # delta = (servo_val - offset) / gain
    steering_to_servo_gain: -0.794    # VESC steering_angle_to_servo_gain
    steering_to_servo_offset: 0.55    # VESC steering_angle_to_servo_offset

    # MPC solver tuning (override defaults via environment variables)
    # MPC_W_LAT_ERROR:    Lateral error weight (default: 340.0)
    # MPC_W_HEADING:      Heading error weight (default: 1000.0)
    # MPC_W_VELOCITY:     Velocity tracking weight (default: 26.0)
    # MPC_W_LAT_VEL:      Lateral velocity weight (default: 69.0)
    # MPC_W_YAW_RATE:     Yaw rate weight (default: 22.0)
    # MPC_W_STEER_RATE:   Steering jerk weight (default: 0.3)
    # MPC_W_STEER_EFFORT: Steering rate effort weight (default: 0.15)
    # MPC_W_TORQUE_RATE:  Acceleration rate weight (default: 0.1)
    # MPC_CROSS_CALL_SCALE: Cross-call rate penalty scale (default: 0.125)

    # Logging
    verbose: false                # Enable verbose console output (disable for RT)
