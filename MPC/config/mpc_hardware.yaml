# MPC Hardware Node Configuration
# Parameters for the F1/10th MPC controller on real hardware
# These can be overridden via environment variables at runtime

mpc_hardware_node:
  ros__parameters:
    # Topic configuration
    odom_topic: "/ego_racecar/odom"                     # VESC odometry topic
    drive_topic: "/drive"                               # Ackermann mux input topic
    servo_topic: "/sensors/servo_position_command"      # VESC servo feedback topic
    imu_topic: "/imu/filtered_angular_velocity"         # Filtered yaw rate topic

    # DEPLOYMENT NOTE: This absolute path is specific to the Jetson filesystem layout.
    # Override at launch time via 'trajectory_file' launch argument or MPC_TRAJECTORY_FILE env var.
    trajectory_file: "/home/f1tenth/BachelorProject/f1tenth_planning/trajectories/my_track_raceline.csv"

    # Multiplier applied to raceline velocities; values below 1.0 reduce top
    # speed for safety during testing, while 1.0 tracks the optimized raceline.
    speed_gain: 1.0
    max_velocity: 20.0            # Maximum reference velocity [m/s]

    # Sets how often MPC commands are recomputed. Keep aligned with actuator
    # update cadence to avoid stale commands and oscillatory behavior.
    control_rate_hz: 200.0

    # Defines how quickly control is zeroed when odometry stops arriving; lower
    # values favor fail-safe behavior, higher values tolerate brief dropouts.
    watchdog_timeout_sec: 0.2

    # VESC servo conversion parameters
    # Forward: servo = gain * (c2·|δ|² + c1·|δ| + c0) + offset
    # Inverse: solve quadratic to recover δ from servo position
    # Gain maps steering angle to VESC servo units and preserves calibrated
    # steering sensitivity for this chassis/servo combination.
    steering_to_servo_gain: -0.7284
    # Offset centers steering in servo command space so zero steering aligns
    # with straight-line driving on the physical platform.
    steering_to_servo_offset: 0.55
    steering_correction_c2: 0.589566  # Polynomial correction (calibrated 2026-03-12)
    steering_correction_c1: 0.918061
    steering_correction_c0: 0.001490

    # MPC solver tuning (override defaults via environment variables)
    # MPC_W_LAT_ERROR: lateral error weight
    # MPC_W_HEADING: heading error weight
    # MPC_W_VELOCITY: velocity tracking weight
    # MPC_W_LAT_VEL: lateral velocity weight
    # MPC_W_YAW_RATE: yaw rate weight
    # MPC_W_STEER_RATE: steering rate-change weight
    # MPC_W_STEER_EFFORT: steering effort weight
    # MPC_W_TORQUE_RATE: acceleration rate-change weight
    # MPC_W_DELTA_ACTUAL: steering centering state weight
    # MPC_CROSS_CALL_SCALE: cross-call rate penalty scale

    # Enables additional diagnostics for bring-up and tuning; keep disabled
    # during real-time driving to minimize console and scheduling overhead.
    verbose: false
