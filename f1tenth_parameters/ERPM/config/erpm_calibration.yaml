post_calibration_steering_dynamics:
  # Runs only after ERPM/current candidate verification and turn-slip fitting.
  # Each trial first reaches speed in a straight line, then steps steering to the
  # target angle and records the yaw/lateral response for later steering-dynamics
  # fitting. Expected lateral acceleration uses wheelbase L=0.324 m.
  enabled: true
  wheelbase_m: 0.324
  max_expected_lateral_accel_mps2: 7.5
  repetitions: 1
  pre_turn_hold_s: 0.15
  capture_s: 0.4
  conditions:
