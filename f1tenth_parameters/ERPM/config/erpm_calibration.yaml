    min_holdout_samples_per_regime: 18
    tie_score_fraction: 0.02
  gates:
    min_valid_lidar_fraction: 0.7
    min_training_repetitions: 3
    min_holdout_repetitions: 2
    max_command_map_relative_holdout_rmse: 0.08
    max_command_map_relative_holdout_bias: 0.04
    max_speed_map_training_rmse_mps: 0.1
    max_speed_map_holdout_rmse_mps: 0.12
    max_speed_map_holdout_bias_mps: 0.05
    max_odom_holdout_rmse_mps: 0.14
    max_odom_holdout_bias_mps: 0.06
    max_odom_holdout_p95_abs_error_mps: 0.28
    max_high_accel_odom_rmse_mps: 0.2
    max_high_accel_odom_bias_mps: 0.09
    max_high_brake_odom_rmse_mps: 0.22
    max_high_brake_odom_bias_mps: 0.1
    max_cross_axis_odom_rmse_mps: 0.2
    max_cross_axis_odom_bias_mps: 0.08
