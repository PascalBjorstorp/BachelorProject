analysis:
  min_lidar_speed_mps: 0.3
  max_lidar_gap_s: 0.075
  max_straight_yaw_rate_rad_s: 0.16
  max_abs_lateral_accel_mps2: 1.5
  max_static_abs_longitudinal_accel_mps2: 0.35
  slip:
    speed_floor_mps: 0.3
    high_slip_ratio_threshold: 0.12
    nonlinear_model_min_holdout_improvement_fraction: 0.08
    max_high_demand_slip_fraction_for_linear_candidate: 0.2
  turn_slip:
    # Causal cornering-slip correction fit from Stage 13 steady arcs.
    # a_lat = v_wheel*|yaw_rate|; v_odom = v_wheel*(1 - clip(c1*a_lat,0,clip)).
    lateral_accel_source: yaw_rate_times_speed
    min_valid_lidar_fraction: 0.6
    min_speed_mps: 0.5
    min_coefficient_per_mps2: 0.002
    min_train_r2: 0.4
    correction_clip_fraction: 0.25
  icp:
    downsample: 1
    # Within-scan motion compensation and constant-velocity translation warm
    # start; important at the 9 m/s end of the speed envelope. Set either false
    # to reproduce the original zero-seed, non-deskewed behaviour.
    motion_deskew: true
    constant_velocity_seed: true
    normal_neighbors: 12
    max_iterations: 80
    max_correspondence_m: 0.35
    trim_fraction: 0.85
    min_correspondences: 120
    min_inlier_ratio: 0.45
    translation_update_tolerance_m: 1.0e-06
    rotation_update_tolerance_rad: 1.0e-06
    relative_cost_tolerance: 1.0e-07
    max_pair_rmse_m: 0.06
    max_hessian_condition_number: 10000.0
    max_imu_yaw_residual_rad: 0.12
  static_map:
    model_candidates:
    - linear
    - quadratic
    - monotone_lut
    lut_max_knots: 8
    minimum_holdout_improvement_fraction: 0.05
    minimum_abs_quadratic_erpm_per_mps2: 0.0
    max_nonmonotonic_slope_fraction: 0.0
  odometry_model_selection:
    candidate_models:
    - legacy_scalar
    - static_linear
    - static_quadratic
    - static_lut
    - adaptive_wheel
    - fused_adaptive
    accel_filter_time_constants_s:
