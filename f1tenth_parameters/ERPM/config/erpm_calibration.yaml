cross_axis_validation:
  # Now used to FIT (not just validate) the turn-induced longitudinal-slip
  # correction: real bags showed the driven wheels over-read ground speed in
  # turns, growing with cornering load, so a single ERPM gain is not trustworthy
  # while steering. Each trial reaches speed straight, then records a short turn
  # segment so it fits a 15x15 m room with a 20-25 m straight. Expected lateral
  # acceleration uses wheelbase L=0.324 m and a_y = v^2*tan(delta)/L.
