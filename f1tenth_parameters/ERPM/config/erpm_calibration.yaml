session:
  runs_dir: runs
  min_free_disk_gb: 12.0
  battery_min_v: 10.5
  hard_speed_limit_mps: 99.0
  command_publish_hz: 100.0
  event_topic: /erpm_calibration/event
  steering_angle_rad: 0.0
  max_motor_temp_c: 80.0
  max_fet_temp_c: 85.0
  cooling_pause_every_accepted_trials: 0
  cooling_pause_s: 0.0
workspace:
  vesc_config_relpath: f1tenth_system/f1tenth_stack/config/vesc.yaml
  colcon_build_command:
  - colcon
  - build
  - --symlink-install
site:
  straight_usable_length_m: 20.0
  setup_margin_m: 1.5
  minimum_full_envelope_length_m: 20.0
  require_full_envelope_track: true
  surface_description: fixed indoor high-grip surface
hardware:
  lidar_ip_address: 192.168.10.10
  base_frame_id: ego_racecar/base_link
  laser_frame_id: ego_racecar/laser
  imu_frame_id: ego_racecar/imu
  laser_to_base_x_m: 0.265
  laser_to_base_y_m: 0.0
  laser_to_base_z_m: 0.05
  laser_to_base_yaw_rad: 0.0
operating_envelope:
  maximum_test_speed_mps: 9.0
  maximum_test_accel_mps2: 999.0
  maximum_test_brake_mps2: 999.0
  minimum_test_speed_mps: 0.5
  # ----------------------------------------------------------------------------
  # Command-scale values for high-demand stages. These are intentionally above
  # the expected VESC clip so the bags show the real firmware/motor response.
  # The runner no longer treats these as software safety caps.
  # ----------------------------------------------------------------------------
  approved_drive_test_current_a: 250.0
  approved_brake_test_current_a: 250.0
  high_speed_capture_s: 0.6
  # Below this speed a commanded a=0 yields zero current (lets the car stop);
  # above it, a=0 must hold speed via drag-compensating current.
  hold_speed_min_mps: 0.5
  high_demand_pulse_duration_s:
    low_fraction: 0.6
    medium_fraction: 0.45
    high_fraction: 0.35
  dynamic_capture_min_s: 0.2
  speed_guard_margin_mps: 0.0
  brake_guard_margin_mps: 0.0
profiles:
  vel_to_erpm:
    operation_mode: VEL_TO_ERPM
    accel_to_current_gain: 0.0
    accel_to_brake_gain: 0.0
    speed_to_erpm_offset: 0.0
  accel_to_current_bootstrap:
    operation_mode: ACCEL_TO_CURRENT
    fallback_accel_to_current_gain: 5.0
    fallback_accel_to_brake_gain: 6.0
preflight:
  required_accel_to_current_gain_vel: 0.0
  required_accel_to_brake_gain_vel: 0.0
  required_speed_to_erpm_offset_vel: 0.0
  raw_motor_tolerance_erpm: 1.0
  raw_motor_tolerance_current_a: 0.25
  max_selector_publishers: 1
  min_command_change_erpm: 100.0
  min_command_change_current_a: 1.0
  max_straight_yaw_rate_rad_s: 0.2
  max_straight_lateral_accel_mps2: 1.2
straight_assist:
  # Incremental heading-hold for straight-running stages. It locks onto the
  # absolute odometry heading at motion start, computes a small proportional
  # correction, then SLEW-LIMITS the servo trim so the wheels are only nudged a
  # tiny amount per command tick. This prevents late one-shot corrections and
  # over-correction. Auto-disabled during intentional non-zero steering arcs.
  #
  # Tune on the car:
  #   - still drifts slowly off to one side -> raise kp_heading a little
  #   - over-corrects / weaves             -> lower kp_heading or max_trim_rad
  #   - corrects too late                  -> raise max_trim_rate_rad_s slightly
  #   - immediately steers wrong way       -> set steer_sign to -1.0
  enabled: true
  kp_heading_rad_per_rad: 1.0
  deadband_rad: 0.0025          # ~0.14 deg: small enough for constant nudges
  max_trim_rad: 0.01           # hard cap on correction (~1.0 deg)
  max_trim_rate_rad_s: 0.025     # at 100 Hz: <=0.0005 rad per tick
  max_trim_step_rad: 0.0005     # absolute per-command jump cap
  min_speed_mps: 0.15           # keep assist active for low-speed ERPM probes
  steer_sign: 1.0
motion_startup:
  # Raw ERPM is a direct VESC speed command and can be jagged from rest on the
  # sensorless motor. Use the same smooth Ackermann/V2E path as the steering
  # calibration for startup, then switch to raw ERPM before the recorded capture.
  raw_erpm_startup_mode: ackermann_speed
  raw_erpm_switch_settle_s: 0.15
  minimum_startup_s: 0.75
  stability_window_s: 0.6
  stability_timeout_s: 2.2
  pre_capture_settle_distance_m: 0.4
  pre_capture_settle_min_s: 0.15
  pre_capture_settle_max_s: 0.85
  max_startup_speed_error_mps: 0.20
  failed_attempt_brake_current_a: 12.0
  failed_attempt_brake_s: 0.35
  failed_attempt_settle_s: 0.25
  max_odom_speed_std_mps: 0.09
  max_abs_imu_ax_mps2: 1.25
  max_erpm_std: 150.0
  raw_erpm_relative_error_fraction: 0.10
  raw_erpm_absolute_error: 100.0
observability:
