# F1/10th Vehicle Parameters
# ==========================
# Fill in these values from physical measurements, CAD model (Inventor),
# and test results. These are used by the dynamic bicycle model in MPC.
#
# Status legend:
#   [MEASURED] - Confirmed from physical measurement or sensor data
#   [CAD]      - From Inventor model (may differ from real car)
#   [TESTED]   - From test scripts in f1tenth_parameters/
#   [CALC]     - Calculated from other values
#   [ESTIMATE] - Initial guess, needs verification
#   [TODO]     - Not yet determined
#
# AUTO-UPDATED: Test scripts automatically write [TESTED] values here.
#
# DEPENDENCY MAP — if you change a fundamental measurement, re-run:
#   mass changed    → test_cornering_stiffness, test_rolling_resistance, test_motor_torque
#   l_f/l_r changed → test_cornering_stiffness
#   r_eff changed   → test_motor_torque
#   gear_ratio      → test_motor_torque
#   wheelbase       → test_cornering_stiffness, test_steering_rate

# ============================================================================
# Physical Properties
# ============================================================================

vehicle:
  mass: 3.314                # [MEASURED] Total vehicle mass (kg), fully loaded (battery,
                             # electronics, sensors, VESC, motor, chassis)
  
  wheelbase: 0.324           # [MEASURED/VERIFIED] Total wheelbase L = l_f + l_r (m)
                             # Measure axle center to axle center, or use test_wheelbase.py
                             # Check: l_f + l_r = 167.9 + 158.0 = 325.9 ≈ 326 mm ✓
  
  l_f: 0.166                 # [CAD] Distance from front axle to center of gravity (m)
  
  l_r: 0.16                  # [CAD] Distance from rear axle to center of gravity (m)
  
  Iz: 0.035                  # [CAD] Yaw moment of inertia (kg·m²)
                             # In Inventor: Mass Properties → Moments of Inertia
                             # around the vertical axis through the CG
                             # Typical for F1/10th: 0.02 - 0.06 kg·m²
                             # MPC default: 0.04712 (sim value, verify with your CAD)
  
  h_cg: 0.0703               # [CAD] Height of center of gravity above ground (m)
                             # MPC default: 0.074 m
                             # Measure from CAD, or balance-tilt method:
                             #   Raise one end, measure tilt angle + axle height change
                             # Affects weight transfer during accel/braking
  
  track_width: 0.23          # [MEASURED] Track width (m) - distance between left and right
                             # tire contact patches (center to center)
                             # Measure with ruler on flat surface
  
  width: 0.273               # [MEASURED] Total vehicle width (m) - widest point
                             # Used for safety margins in planning
                             # MPC default: 0.31 m
  
  length: 0.51               # [MEASURED] Total vehicle length (m) - bumper to bumper
                             # MPC default: 0.53 m
  
  lidar_to_rear_axle: 0.2646 # [CAD] Distance from LiDAR to rear axle (m)
                             # Useful for localization coordinate transforms

# ============================================================================
# Tire Properties
# ============================================================================

tire:
  r_eff: 0.051               # [MEASURED] Effective (loaded) tire radius (m)
                             # Measure from ground to axle center with car on flat surface
                             # Typical Traxxas Slash: ~0.05 m
                             # MPC default: 0.0545 m (diameter 10.9 cm)
  
  mu: 0.745                  # [TESTED] Peak friction coefficient (dimensionless)
                             # From all friction_test_20260226_* runs in data/
                             # using steady-state filtered a_y at highest tested speed (5.0 m/s)
                             # Cross-validated with motor torque test (μ_x ≈ 0.74)
                             # Depends on surface! Re-test if surface changes.
  
  C_alpha_f: 51.40  # [TESTED] Front cornering stiffness (N/rad)
                             # From combined K_us + yaw-frequency method (report_outline.tex)
                             # K_us = 0.0093 rad/(m/s²) from steady-state cornering data
                             # Corrected for nonlinear servo mapping (old gain −0.7940)
                             # Absolute values depend on assumed ω_n=10; ratio C_af/C_ar=1.19
  
  C_alpha_r: 43.10  # [TESTED] Rear cornering stiffness (N/rad)
                             # From combined K_us + yaw-frequency method (see C_alpha_f)
  
  c_roll: 0.163  # Rolling resistance coefficient (dimensionless) — coast-down test 2025-03-11
                             # Measured via coast-down test (test_rolling_resistance.py)
                             # Used by TUM mintime trajectory optimizer

# ============================================================================
# Steering Properties
# ============================================================================

steering:
  max_steering_angle: 0.45 # [CALIBRATED 2026-06-25] Symmetric max steering angle (rad) (25.8°); was 0.4189
                             # Limited to the smaller (right) physical side; both end-stops reach ~26 deg.
                             # Maps to servo 0.532 +/- 0.399 (servo_min/max below), inside the safe end-stops.
  
  max_steering_rate: 2.8492       # [TESTED] Maximum steering rate (rad/s)
                             # From test_steering_rate.py
  
  servo_time_constant: 0.3675     # [TESTED] Time for 60° servo travel (s)
                             # = (60 * pi/180) / max_steering_rate
                             # From test_steering_rate.py
  
  servo_offset: 0.5113       # [DEPLOYED PROVISIONAL 2026-06-27] current vesc.yaml seed after observed right drift
                             # Not accepted as calibrated until the unified centre A/B and fresh straight C pass.
  servo_gain: -0.8667        # [CALIBRATED 2026-06-25] steering_angle_to_servo_gain (effective map; was -0.7284)
  servo_min: 0.1333          # [CALIBRATED 2026-06-25] servo at +0.45 rad (symmetric; was 0.202)
  servo_max: 0.9309          # [CALIBRATED 2026-06-25] servo at -0.45 rad (symmetric; was 0.890)

  # Nonlinearity correction polynomial (2026-06-25 effective LiDAR/IMU map; near-linear)
  # corrected = c2·|δ|² + c1·|δ| + c0  (sign-preserved). Matches vesc.yaml.
  steering_correction_c2: 0.0498
  steering_correction_c1: 1.0
  steering_correction_c0: 0.0

# ============================================================================
# Motor / Drivetrain Properties
# ============================================================================

motor:
  # Traxxas 3351R "Velineon 3500" brushless motor
  # KV ≈ 3500 RPM/V (unloaded, at nominal voltage)
  
  Kv: 3500                   # [DATASHEET] Motor velocity constant (RPM/V)
  
  Kt: 0.00273                # [CALC] Motor torque constant (Nm/A)
                             # Kt = 60 / (2π × Kv) = 60 / (2π × 3500)
                             # This is for the motor shaft, before gearing.
  
  pole_pairs: 2              # [DATASHEET] Velineon 3500 has 4 poles → 2 pole pairs
                             # ERPM = mechanical_RPM × pole_pairs
  
  gear_ratio: 11.82          # [DATASHEET] Total internal gear ratio (motor to wheels)
                             # Traxxas Slash 4x4 internal: 11.82:1
                             # Spur/pinion gearing: 54T/13T = 4.15:1
                             # NOTE: The 11.82 likely INCLUDES the spur/pinion.
                             # Verification from ERPM calibration (erpm_gain=4550):
                             #   gear_ratio = erpm_gain × 2π × r_eff / (pole_pairs × 60)
                             # With r_eff≈0.05m: gear_ratio ≈ 12.0 (matches 11.82)
                             # If gearing on your car differs, update and re-verify.
  
  # --- VESC current limits (configured in VESC Tool) ---
  max_motor_current_limit: 100.0   # [CONFIG] VESC motor current limit (A)
  max_battery_current_limit: 70.0  # [CONFIG] VESC battery current limit (A)
  
  # --- Measured peak currents (from test_motor_torque.py, 5 runs) ---
  max_motor_current: 71.56   # [TESTED] Peak motor current during burst accel (A)
                             # Range: 69.8 - 74.3 A across runs
                             # Burst avg: ~65A for first 0.5s, then VESC PID
                             # reduces to ~14A once target speed is reached.
                             # Battery current at peak: only ~16A (low duty cycle).
  
  max_brake_current: -63.45  # [TESTED] Peak braking (regen) motor current (A)
                             # Range: -59.2 to -65.6 A across runs
  
  max_motor_torque: 0.1954   # [TESTED] Peak drive torque at motor shaft (Nm)
                             # = Kt × max_motor_current = 0.00273 × 71.56
  
  max_brake_torque: 0.1732   # [TESTED] Peak regen braking torque at motor shaft (Nm)
                             # = Kt × |max_brake_current| = 0.00273 × 63.45

  # --- Effective drivetrain parameters (from test_motor_torque.py) ---
  # Linear fit of wheel force vs motor current (5 runs × 4 speeds):
  #   F_net = Kt_eff × I_motor - F_rolling
  # This includes all drivetrain losses (gearing friction, bearing drag, etc.)
  
  Kt_eff: 0.583              # [TESTED] Effective motor-current-to-wheel-force (N/A)
                             # Bin-averaged linear fit R² = 0.92
                             # Theoretical: Kt × gear_ratio / r_eff = 0.632 N/A
                             # Efficiency η = 0.583/0.632 = 92%
  
  rolling_resistance: 2.79   # [TESTED] Rolling resistance force (N)
                             # Intercept of F_net vs I_motor fit
                             # = 0.84 N per kg (≈ Crr × g with Crr ≈ 0.086)
  
  drivetrain_efficiency: 0.92   # [TESTED] Overall drivetrain efficiency
                             # = Kt_eff × r_eff / (Kt × gear_ratio)
                             # = 0.583 × 0.051 / (0.00273 × 11.82) = 0.92
  
  max_wheel_force: 38.9      # [TESTED] Peak net wheel force during accel (N)
                             # = Kt_eff × peak_I - rolling_resistance
                             # = 0.583 × 71.6 - 2.79 ≈ 38.9 N (1.2 g)
  
  accel_to_current_gain: 5.69  # [CALC] Gain for ACCEL_TO_CURRENT mode (A/(m/s²))
                             # = mass / Kt_eff = 3.314 / 0.583
                             # Use in vesc.yaml if switching to torque control.
  
  drivetrain_inertia: ~      # [ESTIMATE/TODO] Combined drivetrain inertia (kg·m²)
                             # Motor rotor + gears + wheels, reflected to wheel side
                             # I_total = I_motor × gear_ratio² + 4 × I_wheel
                             # MPC default: 2.223 (seems high — verify!)
                             # Typical estimate: 0.01 - 0.05 kg·m²
                             # Hard to measure directly at F1/10th scale.
                             # Best approach: calculate from component inertias
                             # or tune during MPC integration.

# ============================================================================
# Dynamic Limits
# ============================================================================

dynamics:
  max_velocity: 12.0         # [TESTED] Maximum achievable velocity (m/s)
                             # From test_max_dynamics.py
  
  max_accel: 7.31            # [TESTED] Maximum longitudinal acceleration (m/s²)
                             # Conservative bound: mu * g = 0.745 * 9.81 = 7.31 m/s²
                             # Smoothed IMU peaks can exceed this due to pitch/sensor coupling.
  
  max_decel: 7.31            # [TESTED] Maximum deceleration (m/s²)
                             # Conservative estimate: mu * g = 0.745 * 9.81 = 7.31 m/s²
                             # Raw IMU peak was ~18.7 m/s² — heavily contaminated by
                             # chassis pitch (nose-down) projecting gravity onto IMU x-axis.
  
  max_lateral_accel: 7.3078  # [TESTED] Maximum lateral acceleration before slide (m/s²)
                             # From test_friction.py: mu × g = 0.745 × 9.81

# ============================================================================
# VESC Calibration (from vesc.yaml, for reference)
# ============================================================================

vesc_calibration:   # mirror of vesc.yaml (2026-06-25 calibration)
  speed_to_erpm_gain: 4740.0
  speed_to_erpm_offset: 0.0
  steering_angle_to_servo_gain: -0.8667
  steering_angle_to_servo_offset: 0.5113  # deployed provisional seed; unified centre C still required

# ============================================================================
# Conversion Notes
# ============================================================================
#
# Motor current to wheel force (MEASURED):
#   F_net = Kt_eff × I_motor - rolling_resistance
#   F_net = 0.371 × I_motor - 2.79   (N)
#   This is the NET force at the contact patch after all drivetrain losses.
#
# Motor current to wheel force (THEORETICAL):
#   F_wheel = Kt × I_motor × gear_ratio × η / r_eff
#   F_wheel = 0.00273 × I × 11.82 × 0.575 / 0.05
#   F_wheel = 0.371 × I   (matches measured Kt_eff!)
#
# Acceleration to motor current (for ACCEL_TO_CURRENT mode):
#   I_motor = (m × a_desired + F_rolling) / Kt_eff
#   I_motor ≈ accel_to_current_gain × a_desired + I_rolling
#   Where accel_to_current_gain = m / Kt_eff = 3.314 / 0.371 ≈ 8.93 A/(m/s²)
#   And I_rolling = rolling_resistance / Kt_eff = 2.79 / 0.371 ≈ 7.5 A
#
# ERPM to ground speed:
#   v = ERPM / speed_to_erpm_gain
#   Motor mechanical RPM = ERPM / pole_pairs
#   Wheel RPM = Motor mechanical RPM / gear_ratio
#   v = Wheel RPM × 2π/60 × r_eff
#   → speed_to_erpm_gain = pole_pairs × gear_ratio × 60 / (2π × r_eff)
#
# Verify: with erpm_gain=4550, pole_pairs=2, r_eff=0.05:
#   gear_ratio = erpm_gain × 2π × r_eff / (pole_pairs × 60)
#              = 4550 × 2π × 0.05 / (2 × 60) = 1429.4 / 120 ≈ 11.91
#   This looks reasonable for the Traxxas Slash 4x4 (spec: 11.82).
