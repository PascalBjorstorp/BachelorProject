# The bagger records ALL visible and hidden ROS topics from the dedicated
# calibration stack. Required lists below are checked after every bag closes.
recording:
  record_all_topics: true
  include_hidden_topics: true
  qos_profile_overrides: config/bag_qos_overrides.yaml

required:
  hardware_only:
    - /sensors/imu/raw
    - /sensors/core
    - /ego_racecar/odom
    - /steering_calibration/servo_raw
    - /steering_calibration/servo_mode
    - /steering_calibration/servo_selected
    - /steering_calibration/servo_selector_status
    - /commands/servo/position
    - /sensors/servo_position_command
    - /steering_calibration/event
    # Stage 0 moves steering only; speed=0 does not necessarily publish an ERPM command.
  full_stationary:
    - /sensors/imu/raw
    - /sensors/core
    - /ego_racecar/odom
    - /scan
    - /tf_static
    - /drive
    - /ackermann_cmd
    - /steering_calibration/servo_raw
    - /steering_calibration/servo_from_ackermann
    - /steering_calibration/servo_mode
    - /steering_calibration/servo_selected
    - /steering_calibration/servo_selector_status
    - /commands/servo/position
    - /sensors/servo_position_command
    - /steering_calibration/event
  full_motion:
    - /sensors/imu/raw
    - /sensors/core
    - /ego_racecar/odom
    - /scan
    - /tf_static
    - /drive
    - /ackermann_cmd
    - /steering_calibration/servo_raw
    - /steering_calibration/servo_from_ackermann
    - /steering_calibration/servo_mode
    - /steering_calibration/servo_selected
    - /steering_calibration/servo_selector_status
    - /commands/servo/position
    - /sensors/servo_position_command
    - /commands/motor/speed
    - /steering_calibration/event

# Topics that are not required in every stage, but will still be captured by
# --all. Their absence is reported in the post-run capture audit.
redundancy_topics:
  - /commands/motor/current
  - /commands/motor/brake
  - /rosout
  - /diagnostics
  - /diagnostics_agg
  - /clock
  - /parameter_events
  - /tf
