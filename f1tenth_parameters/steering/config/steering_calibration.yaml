# Steering calibration configuration. The tester does not edit this during a
# session. The runner snapshots and temporarily patches the source VESC YAML,
# performs a full workspace build, runs the campaign, then restores the exact
# original file and rebuilds. This file is copied unchanged into every session.

session:
  runs_dir: runs
  min_free_disk_gb: 8.0
  # Traxxas 3S LiPo: hard stop at 3.50 V/cell. Start with a charged pack.
  battery_min_v: 10.50
  hard_speed_limit_mps: 1.20
  # Command refresh only. Native topics are bagged at their own publisher rates.
  command_publish_hz: 100.0
  event_topic: /steering_calibration/event

workspace:
  # Source configuration temporarily patched for the dedicated calibration stack.
  # A byte-exact backup and recovery lock are created before modification.
  vesc_config_relpath: f1tenth_system/f1tenth_stack/config/vesc.yaml
  colcon_build_command: [colcon, build, --symlink-install]

hardware:
  lidar_ip_address: 192.168.10.10
  laser_to_base_x_m: 0.265
  laser_to_base_y_m: 0.0
  laser_to_base_yaw_rad: 0.0
  wheelbase_m: 0.324

initial:
  # A safe seed only. The actual centre is fitted from repeated yaw-zero passes.
  raw_servo_seed: 0.550

preflight:
  raw_servo_audit_delta: 0.020
  raw_servo_echo_tolerance: 0.004
  raw_servo_bus_tolerance: 0.004
  raw_servo_selected_tolerance: 0.004
  min_echo_span_servo: 0.010
  # Enforced against live ROS node parameters after the runner applies its
  # temporary VEL_TO_ERPM/full-domain calibration patch and rebuilds.
  required_accel_to_current_gain: 0.0
  required_accel_to_brake_gain: 0.0
  required_servo_min: 0.0
  required_servo_max: 1.0

motion_startup:
  minimum_startup_s: 0.75
  stability_window_s: 0.60
  stability_timeout_s: 4.0
  max_speed_error_mps: 0.18
  max_speed_std_mps: 0.09
  max_abs_longitudinal_accel_mps2: 0.45

centre_trim:
  speed_mps: 0.50
  capture_s: 5.0
  initial_half_width_servo: 0.020
  expansion_step_servo: 0.015
  max_bracket_expansions: 3
  candidate_repetitions: 3
  max_refinement_iterations: 5
  search_tolerance_servo: 0.0010
  max_abs_yaw_rate_for_candidate_rad_s: 0.025
  confirmation_repetitions: 5
  max_center_servo_spread: 0.010
  max_abs_yaw_rate_for_confirmation_rad_s: 0.060

endstops:
  coarse_step_servo: 0.010
  fine_step_servo: 0.002
  ultra_fine_step_servo: 0.0005
  safety_margin_servo: 0.006
  # Exactly one explicit final confirmation per side. REDO remains unlimited.
  measurements_per_side: 1
  # During end-stop discovery only, the selector permits the ROS numeric domain.
  raw_servo_domain_min: 0.0
  raw_servo_domain_max: 1.0

observability:
  stationary_s: 30.0
  straight_speeds_mps: [0.40, 0.60, 0.80]
  straight_repetitions: 3
  straight_capture_s: 7.0
  gentle_turn_fraction_of_safe_span: 0.12
  turn_repetitions: 3
  turn_speed_mps: 0.50
  turn_capture_s: 7.0

static_map:
  speed_mps: 0.60
  steering_settle_s: 0.40
  capture_s: 8.0
  training_fractions: [0.12, 0.27, 0.42, 0.57, 0.72, 0.87]
  training_sweep_repetitions: 4
  validation_fractions: [0.18, 0.39, 0.61, 0.83]
  validation_repetitions: 3
  raw_servo_echo_tolerance: 0.004

response:
  speeds_mps: [0.60, 0.90]
  target_fractions: [0.30, 0.60]
  repetitions: 4
  centre_hold_s: 2.5
  step_hold_s: 3.5
  return_hold_s: 2.5

analysis:
  icp:
    max_iterations: 80
    translation_update_tolerance_m: 1.0e-6
    rotation_update_tolerance_rad: 1.0e-6
    relative_cost_tolerance: 1.0e-7
    max_correspondence_m: 0.30
    downsample: 1
    normal_neighbors: 9
    trim_fraction: 0.85
    min_correspondences: 140
    min_inlier_ratio: 0.45
    max_pair_rmse_m: 0.030
    max_hessian_condition_number: 10000.0
    max_imu_yaw_residual_rad: 0.020
  map:
    trim_s: 1.5
    min_lidar_speed_mps: 0.20
    max_lidar_speed_std_mps: 0.08
    max_yaw_std_rad_s: 0.08
    max_icp_rmse_m: 0.030
    min_valid_scan_fraction: 0.70
