# Hokuyo LiDAR Configuration
# ==========================
# For URG-04LX, URG-10LX, or similar Hokuyo sensors

urg_node:
  ros__parameters:
    # Serial port configuration
    # Use /dev/sensors/hokuyo if you set up udev rules
    serial_port: /dev/sensors/hokuyo
    serial_baud: 115200
    
    # Alternatively, use IP for ethernet-connected sensors
    # ip_address: 192.168.0.10
    # ip_port: 10940
    
    # Frame ID for laser messages
    laser_frame_id: laser
    
    # Scan parameters
    angle_min: -2.35619    # -135 degrees in radians
    angle_max: 2.35619     # +135 degrees in radians
    angle_increment: 0.00436332  # ~0.25 degrees
    
    # Range limits (meters)
    range_min: 0.02
    range_max: 30.0
    
    # Timing
    time_offset: 0.0
    
    # Intensity data
    publish_intensity: false
    
    # Clustering (for noise reduction)
    cluster: 1
    
    # Skip scans (set to 0 for all scans)
    skip: 0
