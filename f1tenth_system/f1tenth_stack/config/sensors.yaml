# Hokuyo UST-10LX LiDAR Configuration (Ethernet)
# ==============================================
# Industrial-grade 2D LiDAR with Ethernet connection
#
# UST-10LX Specs:
# - Range: 0.06m - 10m
# - Field of View: 270 degrees
# - Angular Resolution: 0.25 degrees
# - Scan Rate: 40Hz
# - Interface: Ethernet (default IP: 192.168.0.10)
#
# Network Setup:
# 1. Connect LiDAR to Jetson via Ethernet
# 2. Set Jetson IP in same subnet: sudo ip addr add 192.168.0.2/24 dev eth0
# 3. Verify connection: ping 192.168.0.10
# 4. Launch the driver

urg_node:
  ros__parameters:
    # Ethernet connection (UST-10LX default)
    ip_address: "192.168.0.10"
    ip_port: 10940
    
    # Frame ID for laser messages (matches TF tree)
    laser_frame_id: laser
    
    # UST-10LX scan parameters
    # 270 degree FOV: -135° to +135°
    angle_min: -2.35619    # -135 degrees in radians
    angle_max: 2.35619     # +135 degrees in radians
    angle_increment: 0.00436332  # 0.25 degrees = 1080 points
    
    # UST-10LX range limits (meters)
    range_min: 0.06        # Minimum range 60mm
    range_max: 10.0        # Maximum range 10m
    
    # Timing
    time_offset: 0.0
    
    # Intensity data (UST-10LX supports this)
    publish_intensity: true
    
    # Clustering (1 = no clustering, higher = noise reduction)
    cluster: 1
    
    # Skip scans (0 = publish all scans at 40Hz)
    skip: 0
