# Hokuyo UST-10LX Ethernet LiDAR Configuration
# 
# Hardware Specs:
#   - Range: 0.06m to 10m (typical), 0.06m to 30m (max reflective)
#   - Angular range: 270 degrees (-135° to +135°)
#   - Angular resolution: 0.25° (1080 steps)
#   - Scan frequency: 40 Hz
#   - Connection: Ethernet (default IP after reconfiguration: 192.168.10.10)
#
# Network Setup:
#   1. Connect LiDAR to Jetson via Ethernet
#   2. Configure Jetson's Ethernet interface:
#      sudo ip addr add 192.168.10.15/24 dev eth0
#   3. Test connectivity:
#      ping 192.168.10.10
#
# Usage:
#   ros2 launch f1tenth_lidar hokuyo_lidar.launch.py

# =============================================================================
# Shared Hokuyo UST-10LX parameters
# =============================================================================
# These are loaded by BOTH drivers. The urg_node and hokuyo_scip_driver
# sections reference the same physical sensor, so connection, frame, angle,
# range, and clustering settings are kept in sync.
#
# Cluster = 4 → every 4th step → 1080/4 = 270 beams at 1° resolution
# Skip    = 0 (SCIP) / 1 (urg_node) → publish every scan at full 40 Hz

# ─── Custom SCIP 2.0 driver (recommended, full 40 Hz) ───────────────────────
hokuyo_scip_driver:
  ros__parameters:
    # Connection
    ip_address: "192.168.10.10"
    ip_port: 10940

    # Frame and topic
    laser_frame_id: "ego_racecar/laser"
    scan_topic: "/scan"

    # Angular limits (radians) — UST-10LX: −135° to +135° (270° FOV)
    angle_min: -2.356194   # -135 deg
    angle_max:  2.356194   # +135 deg

    # Clustering: merge N adjacent steps into one beam
    # 1 = 1080 beams at 0.25°   (full resolution)
    # 4 = 270  beams at 1.00°   (recommended for AMCL)
    cluster: 4

    # SCIP scan interval: 0 = every scan (full 40 Hz), 1 = every other, …
    skip: 0

    # Range filtering (meters)
    range_min: 0.1
    range_max: 10.0

# ─── Fallback urg_node driver (~20 Hz) ──────────────────────────────────────
urg_node:
  ros__parameters:
    # Connection
    ip_address: "192.168.10.10"
    ip_port: 10940

    # Frame
    laser_frame_id: "ego_racecar/laser"

    # Angular limits (radians)
    angle_min: -2.356194   # -135 deg
    angle_max:  2.356194   # +135 deg

    # urg_node skip: 1 = publish every scan, 2 = every 2nd, …
    skip: 1

    # Cluster
    cluster: 1

    # Range filtering (meters)
    range_min: 0.1
    range_max: 10.0

    # Quality
    publish_intensity: true
    publish_multiecho: false
