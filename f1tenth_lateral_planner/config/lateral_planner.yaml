# Lateral Planner Configuration (C++)
lateral_planner_node:
  ros__parameters:
    # Global raceline CSV path (empty = use launch arg or package share)
    trajectory_file: "/home/f1tenth/BachelorProject/f1tenth_planning/trajectories/my_track_raceline.csv"

    # Safety margin added to opponent width when computing shift [m]
    safety_margin_m: 0.3

    # Minimum avoidance window length (full, not half) [m]
    # Even at zero speed, the shift ramp will span at least this distance.
    min_window_m: 8.0

    # Total window = max(min_window_m, speed × window_time_s × 2)
    # At 5 m/s with 2.0s: total window = max(15, 20) = 20m
    window_time_s: 2.0

    # Maximum lateral raceline shift [m]
    # Capped to prevent the path from leaving the track.
    max_lateral_shift_m: 0.8

    # Own car width [m] — used for wall clearance checks
    car_width_m: 0.31

    # Minimum clearance from path edge to wall [m]
    wall_safety_margin_m: 0.15

    # Approximate half-width of the track measured from the raceline [m]
    # Shift is clamped so path stays within: track_half_width - car_width/2 - wall_safety
    track_half_width_m: 1.5

    # Don't start replanning if opponent is closer than this [m]
    min_replan_dist_m: 0.4

    # How many waypoints to include ahead/behind the car
    lookahead_points: 80
    lookbehind_points: 0

    # Opponent must move more than this [m] from its locked position
    # before the avoidance path is recomputed (prevents jitter)
    opponent_move_thresh: 0.5

    # Car must be this many meters past the opponent (arc-length)
    # before the avoidance path is unlocked
    pass_complete_margin: 2.0

    # Fraction of the avoidance window placed BEFORE the opponent [0..1]
    # 0.7 = 70% lead-in, 30% tail → car starts shifting much earlier
    window_lead_ratio: 0.5

    # Publishing rate [Hz] — matches LiDAR scan rate
    publish_rate_hz: 40.0

    # Enable/disable the planner at startup
    enabled: true

    # Frame IDs
    map_frame: "map"
    base_frame: "ego_racecar/base_link"
    laser_frame: "ego_racecar/laser"

    # Topics
    obstacles_topic: "/scan_obstacles"
    odom_topic: "/ego_racecar/odom"
    raceline_topic: "/local_raceline"
    enable_topic: "/lateral_planner_enable"
