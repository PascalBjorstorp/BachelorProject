bridge:
  ros__parameters:
    # topics and namespaces
    ego_namespace: 'ego_racecar'
    ego_scan_topic: 'scan'
    ego_odom_topic: 'odom'
    ego_opp_odom_topic: 'opp_odom'
    ego_drive_topic: 'drive'
    opp_namespace: 'opp_racecar'
    opp_scan_topic: 'opp_scan'
    opp_odom_topic: 'odom'
    opp_ego_odom_topic: 'opp_odom'
    opp_drive_topic: 'opp_drive'

    # transform related
    scan_distance_to_base_link: 0.275
    
    # laserscan parameters
    scan_fov: 4.71239         # 270 degrees in radians
    scan_beams: 1080          # 0.25 degree resolution
    scan_range_max: 10.0      # 10 meters
    scan_noise_std: 0.04      # 4cm stddev

    # map parameters
    # Map name (without extension). The bridge node resolves this to
    # <package_share>/maps/<map_path>.yaml at runtime.
    map_path: 'my_track_map'
    map_img_ext: '.pgm'

    # car parameters and scale
    vehicle_params: 'f1tenth'
    scale: 1.0

    # ====================
    # Vehicle Parameter Overrides (from vehicle_params.yaml measurements)
    # ====================
    # Set to 0.0 to use the default f1tenth_gym values.
    # Set to a positive value to override the default.
    # Defaults: mu=1.0489, m=3.74, I=0.04712, lf=0.15875, lr=0.17145
    vehicle_mu: 0.745       # [TESTED] Surface friction coefficient (all 5 friction runs)
    vehicle_m: 3.314        # [MEASURED] Vehicle mass in kg
    vehicle_I: 0.035        # [CAD] Moment of inertia Iz in kg*m^2
    # C_Sf/C_Sr: dimensionless tire stiffness. F_y = mu * C_S * F_z * alpha
    # Derived from measured C_alpha (corrected for nonlinear servo mapping):
    #   F_zf = m*g*l_r/L = 3.314*9.81*0.160/0.324 = 16.05 N
    #   F_zr = m*g*l_f/L = 3.314*9.81*0.166/0.324 = 16.66 N
    #   C_Sf = C_alpha_f / (mu * F_zf) = 51.4 / (0.745 * 16.05) = 4.297
    #   C_Sr = C_alpha_r / (mu * F_zr) = 43.1 / (0.745 * 16.66) = 3.473
    vehicle_C_Sf: 4.297     # [TESTED] Front tire stiffness [1/rad]
    vehicle_C_Sr: 3.473     # [TESTED] Rear tire stiffness [1/rad]
    # Geometry overrides
    vehicle_lf: 0.166       # [CAD] CG to front axle (m)
    vehicle_lr: 0.16        # [CAD] CG to rear axle (m)
    vehicle_h: 0.0703       # [CAD] CG height (m)
    vehicle_s_max: 0.4189   # [CALIBRATED] Max steering angle (rad) — with polynomial correction
    vehicle_sv_max: 2.8492  # [TESTED] Max steering rate (rad/s)
    vehicle_a_max: 7.31     # [TESTED] Max accel (m/s^2), bounded by mu*g
    vehicle_v_max: 20.0     # Sim speed limit (m/s)
    vehicle_v_min: -5.0     # Min velocity (m/s) — matches gym default
    vehicle_v_switch: 7.319  # [DEFAULT] Power-limited acceleration transition speed (m/s)
    vehicle_width: 0.273    # [MEASURED] Vehicle width (m)
    vehicle_length: 0.51    # [MEASURED] Vehicle length (m)

    # opponent parameters
    num_agent: 1

    # ego starting pose on map (Spielberg raceline[0] in map frame)
    sx: -69.343898
    sy: 54.014155
    stheta: 0.212219

    # opp starting pose on map
    sx1: -2.0
    sy1: -2.0
    stheta1: -2.88

    # teleop
    kb_teleop: False
    teleop_steering_angle: 0.3

    # simulation timing
    sim_timestep: 0.005 #200Hz
    
    use_sim_time: False

    # if false, only steps sim on new /drive messages
    async_mode: True

    # ====================
    # Sensor Noise (for realistic sim-to-real transfer)
    # ====================
    # Enable to add Gaussian noise to odometry for more realistic simulation
    odom_noise_enabled: True     # Set to true for realistic testing
    odom_pos_noise_std: 0.01      # Position noise std dev (m) - typical VIO/wheel encoder drift
    odom_vel_noise_std: 0.05      # Velocity noise std dev (m/s)  
    odom_yaw_noise_std: 0.005     # Yaw noise std dev (rad) - ~0.3 degrees
    
    # ====================
    # TF Frame Configuration
    # ====================
    # For standard ROS TF tree: map -> ego_racecar/odom -> base_link
    # - tf_frame_id: 'ego_racecar/odom' - Simulation TF publishes ego_racecar/odom -> base_link (requires AMCL for map -> ego_racecar/odom)
    # - tf_frame_id: 'map'  - Simulation TF publishes map -> base_link (ground truth, no AMCL needed)
    # Use 'ego_racecar/odom' when running with AMCL/localization, 'map' for ground truth testing
    tf_frame_id: 'ego_racecar/odom'          # Parent frame for TF: 'map' or 'ego_racecar/odom'
    odom_frame_id: 'ego_racecar/odom'        # Parent frame for odom topic: 'map' or 'ego_racecar/odom'
    
    # ====================
    # Scan Rate Limiting (for realistic LiDAR simulation)
    # ====================
    # Real LiDARs have specific rates: Hokuyo UTM-30LX = 40Hz, RPLidar A1 = 5.5Hz
    # Set to 0 for no rate limiting (full 250Hz), or target Hz for realistic simulation
    scan_publish_rate: 40.0      # 40 Hz (realistic Hokuyo rate), 0 = no limit

    # ====================
    # Real-Time Factor
    # ====================
    # Controls sim speed relative to wall clock:
    #   0.0 = unlimited (run as fast as possible) - default
    #   1.0 = real-time (sim time == wall time)
    #   0.5 = half speed, 2.0 = double speed
    # Set to 1.0 when recording bags for benchmarking to avoid sim/wall time mismatch
    real_time_factor: 1.0
