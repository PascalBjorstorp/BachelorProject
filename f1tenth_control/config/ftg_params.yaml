# Follow The Gap (FTG) Algorithm Configuration
# =============================================
# Pure FTG implementation based on reference that achieves 8 m/s
# This is designed for real-world use without a map.

ftg_node:
  ros__parameters:
    # ===================
    # Vehicle Parameters
    # ===================
    wheelbase: 0.324        # Distance between front and rear axles (m)
    car_width: 1.0          # Width for disparity extension (m) - larger for more safety margin

    # ===================
    # Speed Control (Reference FTG Formula)
    # ===================
    # Speed = min_speed + (max_speed - min_speed) * range_factor * steer_factor
    max_speed: 6.0          # Maximum allowed speed (m/s)
    min_speed: 2.0          # Minimum speed (m/s)
    speed_full_range: 9.0   # Distance (m) at which full speed is allowed
    steer_slowdown_gain: 0.7 # How much steering reduces speed (0=none, 1=max)

    # ===================
    # Steering Control
    # ===================
    max_steering_angle: 0.4  # Maximum steering angle (~23 degrees) (rad)
    steering_gain: 0.8       # Gain for steering toward gap (reduced from 1.0 for stability)
    max_steering_delta: 0.05 # Maximum steering change per update (rad) - reduced for smoothness
    target_angle_smoothing: 0.3  # Target angle EMA smoothing (0=none, higher=more smooth)

    # ===================
    # Safety Parameters
    # ===================
    emergency_brake_distance: 0.2 # Emergency stop if obstacle closer (m) - reduced for tight spaces

    # ===================
    # LiDAR Processing
    # ===================
    lidar:
      # Range limits
      range_min: 0.1        # Ignore readings closer than this (m)
      range_max: 12.0       # Maximum range to consider (m)

      # Angular limits - only process this range
      # Default: -90 to +90 degrees (front half)
      angle_min: -1.57      # Minimum angle to process (rad)
      angle_max: 1.57       # Maximum angle to process (rad)

      # Noise filtering
      apply_median_filter: true  # Apply median filter for noise reduction
      median_window_size: 3      # Window size (should be odd)

      # Disparity extension
      disparity_threshold: 0.5   # Threshold for detecting disparities (m)

      # Gap detection - CRITICAL for not getting stuck
      gap_threshold: 0.5    # Minimum range to consider as "gap" (m) - reduced
      min_gap_width: 0.1    # Minimum angular width of valid gap (rad) - reduced

      # Safety bubble
      apply_bubble: true    # Enable safety bubble
      bubble_radius: 0.15   # Radius of the bubble (m) - reduced

    # ===================
    # Mapping Mode
    # ===================
    mapping_mode: false
    mapping_sample_rate: 20.0
