# Follow The Gap (FTG) Algorithm Configuration
# =============================================
# Pure FTG implementation based on reference that achieves 8 m/s
# This is designed for real-world use without a map.

ftg_node:
  ros__parameters:
    # ===================
    # Vehicle Parameters
    # ===================
    wheelbase: 0.324        # Distance between front and rear axles (m)
    car_width: 0.30         # Width for disparity extension (m) - actual car width

    # ===================
    # Speed Control (Reference FTG Formula)
    # ===================
    # Speed = min_speed + (max_speed - min_speed) * range_factor * steer_factor
    max_speed: 12.0          # Maximum allowed speed (m/s) - reduced for tight corners
    min_speed: 1.0          # Minimum speed (m/s)
    speed_full_range: 3.0   # Distance (m) at which full speed is allowed
    steer_slowdown_gain: 0.2 # How much steering reduces speed (0=none, 1=max) - slow down more on turns

    # ===================
    # Steering Control
    # ===================
    max_steering_angle: 0.4  # Maximum steering angle (~23 degrees) (rad)
    steering_gain: 1.0       # Gain for steering toward gap
    max_steering_delta: 0.12 # Maximum steering change per update (rad)

    # ===================
    # Safety Parameters
    # ===================
    emergency_brake_distance: 0.2 # Emergency stop if obstacle closer (m) - reduced for tight spaces

    # ===================
    # FTG-Specific Processing
    # ===================
    # These parameters are specific to the Follow The Gap algorithm
    disparity_threshold: 0.6  # Threshold for detecting disparities (m) - lower = more sensitive
    gap_threshold: 0.8         # Minimum range to consider as "gap" (m) - readings > this are "open"
    min_gap_width: 0.3        # Minimum angular width of valid gap (rad) ~8 degrees
    bubble_radius: 1.0         # Safety bubble radius around closest point (m) - larger for more safety
    apply_bubble: true         # Enable safety bubble
    wall_margin: 0.15          # Shrink all readings by this amount (m) - creates clearance from parallel walls
                               # Set to 0.0 to disable. Typical value: half of car width

    # ===================
    # Generic LiDAR Preprocessing
    # ===================
    # These parameters are generic and can be reused by other algorithms
    lidar:
      range_min: 0.1        # Ignore readings closer than this (m)
      range_max: 10.0       # Maximum range to consider (m)
      angle_min: -1.57      # Minimum angle to process (rad) - -90 degrees
      angle_max: 1.57       # Maximum angle to process (rad) - +90 degrees
      apply_median_filter: true  # Apply median filter for noise reduction
      median_window_size: 3      # Window size (should be odd)

    # ===================
    # Mapping Mode
    # ===================
    mapping_mode: false
    mapping_sample_rate: 20.0
