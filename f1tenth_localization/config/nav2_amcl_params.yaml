# Nav2 AMCL parameters for the F1TENTH OptiTrack localization tests.
#
# Intended to run next to:
#   ros2 launch f1tenth_stack System_no_localization.launch.py
#
# Aligned with config/gpu_amcl_cpp_params.yaml where Nav2 AMCL exposes
# equivalent parameters. GPU-only features such as roughening, scan-age
# rejection, and slip-aware noise scaling have no direct Nav2 parameter.

amcl:
  ros__parameters:
    use_sim_time: false

    # Motion model
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    alpha1: 0.4
    alpha2: 0.4
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.1

    # Frames/topics
    base_frame_id: "ego_racecar/base_link"
    odom_frame_id: "ego_racecar/odom"
    global_frame_id: "map"
    scan_topic: "/scan"
    map_topic: "/map"

    # Particle filter
    min_particles: 1000
    max_particles: 1000
    pf_err: 0.02
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1

    # Scan model
    laser_model_type: "likelihood_field"
    max_beams: 270
    z_hit: 0.95
    z_rand: 0.05
    z_max: 0.0
    z_short: 0.0
    sigma_hit: 0.06
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_min_range: -1.0
    laser_max_range: 10.0
    do_beamskip: false
    beam_skip_distance: 0.5
    beam_skip_threshold: 0.3
    beam_skip_error_threshold: 0.9

    # Match the custom AMCL test mode: process every scan by default.
    update_min_d: 0.05
    update_min_a: 0.05

    # Publishing / lifecycle
    tf_broadcast: true
    transform_tolerance: 0.02
    save_pose_rate: 1.0
    always_reset_initial_pose: false
    set_initial_pose: false
    initial_pose.x: 0.0
    initial_pose.y: 0.0
    initial_pose.z: 0.0
    initial_pose.yaw: 0.0
    freespace_downsampling: false
