# ============================================================
# GPU AMCL C++ — Unified parameter file
# ============================================================
# Contains parameters for all three nodes:
#   - gpu_amcl_cpp   (AMCL particle filter)
#   - odom_fused     (odom relay with covariance)
#   - ekf_localization (EKF sensor fusion + TF broadcast)
#
# All values are configurable — nothing is hardcoded.
# ============================================================

## OLD VALUES (for reference):
# min_particles: 300
# max_particles: 1000
# kld_epsilon: 0.05
# kld_z: 2.33

# sigma_hit: 0.05
# z_hit: 0.975
# z_rand: 0.025


# ────────────────────────────────────────────────────────────────
#  AMCL Node
# ────────────────────────────────────────────────────────────────
gpu_amcl_cpp:
  ros__parameters:
    # ---- General ----
    use_gpu: true

    # ---- Particles ----
    num_particles: 1000
    min_particles: 500
    max_particles: 2000

    # ---- KLD adaptive sampling ----
    # Dynamically adjusts particle count based on distribution spread.
    # When converged (tight cluster), uses fewer particles → saves GPU time.
    # When uncertain (spread out), uses more particles → better coverage.
    use_kld_sampling: false
    kld_epsilon: 0.02          # KL-divergence error bound (smaller → more particles)
    kld_z: 2.33                # Quantile: 2.33 = 99%, 1.96 = 95%
    kld_bin_x: 0.5             # metres per occupied KLD bin in x
    kld_bin_y: 0.5             # metres per occupied KLD bin in y
    kld_bin_theta: 0.1         # radians per occupied KLD bin in heading

    # ---- Frame IDs ----
    base_frame_id: "ego_racecar/base_link"
    odom_frame_id: "ego_racecar/odom"
    global_frame_id: "map"

    # ---- Topics ----
    scan_topic: "/scan"
    odom_topic: "/ego_racecar/odom"

    # ---- Update thresholds (metres / radians) ----
    # How much the robot must move before we run a PF update.
    # Higher = fewer updates = less noise accumulation but less responsive.
    update_min_d: 0.00
    update_min_a: 0.00

    # ---- Scan freshness ----
    # Max age (seconds) of a scan before it's rejected as stale.
    # Tight gate to avoid stale corrections under backlog.
    max_scan_age: 0.04

    # ---- Motion model (odometry noise, Prob. Robotics §5.4) ----
    # These control how much random noise is added to each particle.
    # For simulation (accurate odom), use LOW values.
    # For real hardware (noisy odom/slip), increase 5-10x.
    alpha1: 0.2    # rotation  → rotation  noise 0.0001 for sim
    alpha2: 0.2    # translation → rotation  noise
    alpha3: 0.1    # translation → translation noise
    alpha4: 0.1    # rotation  → translation noise

    # ---- Slip-aware noise scaling ----
    # During aggressive turns, increase noise to account for tire slip
    slip_angular_threshold: 1.0  # rad/s — angular velocity above which slip is assumed
    slip_noise_multiplier: 2.5   # multiply alpha values by this during slip

    # ---- Sensor model (likelihood field, Prob. Robotics §6.4) ----
    max_beams: 270
    z_hit: 0.975
    z_rand: 0.025
    sigma_hit: 0.12         # meters; wider helps global convergence with map/scan mismatch
    laser_max_range: 10.0
    laser_offset_x: 0.265   # LiDAR X offset from base_link
    laser_offset_y: 0.0     # LiDAR Y offset from base_link

    # ---- Resampling ----
    resample_threshold: 0.5  # resample when N_eff < threshold * N
    enable_recovery_injection: false  # keep false while tuning raw AMCL convergence
    recovery_injection_ratio: 0.05    # 5% runtime recovery particles; use 0.10 if it must recover more aggressively
    enable_local_roughening: true      # bad scan match -> jitter local particles after resample
    local_roughening_ratio: 0.25       # replace 20% around current local mean
    local_roughening_xy_std_m: 0.20    # 12 cm XY noise
    local_roughening_yaw_std_rad: 0.0872664626  # 5 deg yaw noise
    local_roughening_bad_log_weight_per_beam: -1.0
    local_roughening_max_cloud_std_m: 0.75      # only roughen when cloud is already local

    # ---- Initial pose ----
    # false: seed particles around initial_pose_*
    # true: seed particles globally along raceline corridor with forward heading cone
    global_initialization: true
    global_heading_cone_rad: 0.5235987756  # +/- 30 deg around nearest raceline heading
    global_track_margin_m: 0.15            # keep global samples this far from walls
    global_max_lateral_offset_m: 1.0       # do not trust huge d_left/d_right CSV widths during global sampling
    global_heading_trajectory_file: ""     # absolute path override; empty resolves package/rel path below
    global_heading_trajectory_package: "f1tenth_planning"
    global_heading_trajectory_rel_path: "trajectories/my_track_raceline.csv"

    # Used only when global_initialization=false, and as covariance for RViz 2D Pose Estimate.
    initial_pose_x: 0.0
    initial_pose_y: 0.0
    initial_pose_a: 0.0
    initial_cov_xx: 0.1
    initial_cov_yy: 0.1
    initial_cov_aa: 0.1

    # ---- Publishing ----
    cloud_publish_rate: 0.1      # Hz — particle cloud visualization rate (lower saves GPU bandwidth)



# ────────────────────────────────────────────────────────────────
#  Odom Relay Node  (VESC odom already includes IMU-fused heading)
# ────────────────────────────────────────────────────────────────
odom_fused:
  ros__parameters:
    # ---- Topics ----
    odom_topic: "/ego_racecar/odom"           # INPUT: Raw wheel odometry
    output_topic: "/odom_pose"                # OUTPUT: PoseWithCovarianceStamped

    # ---- Frames ----
    frame_id: "ego_racecar/odom"               # Header frame_id for published pose (must match odom_frame)

    # ---- Base covariances (metres² / rad²) ----
    pass_through_covariance: true            # Forward covariance from /ego_racecar/odom
    base_cov_xy: 0.05                        # Variance for x and y
    base_cov_theta: 0.05                     # Variance for yaw (theta)        


# ────────────────────────────────────────────────────────────────
#  EKF Node
# ────────────────────────────────────────────────────────────────
ekf_localization:
  ros__parameters:
    # ---- Topics ----
    amcl_topic: "/amcl_pose"
    odom_topic: "/odom_pose"
    output_topic: "/ekf_pose"

    # ---- Frames ----
    global_frame: "map"
    odom_frame: "ego_racecar/odom"
    base_frame: "ego_racecar/base_link"

    # ---- EKF tuning ----
    transform_tolerance: 0.02    # seconds into the future for TF
    process_noise_scale: 0.1    # multiplier on odom covariance for Q
    amcl_max_latency_sec: 0.10  # Drop AMCL updates older than 80 ms
