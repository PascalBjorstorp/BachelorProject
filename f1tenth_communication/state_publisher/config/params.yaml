# State Publisher Parameters
state_publisher:
  ros__parameters:
    # Path to trajectory CSV file (comma-delimited)
    # Format: s_m,x_m,y_m,psi_rad,kappa_radpm,vx_mps,ax_mps2
    trajectory_file: "/ros2_ws/src/f1tenth_planning/trajectories/Spielberg_raceline.csv"
    
    # Input topic (localization output)
    odom_topic: "/ego_racecar/odom"
    
    # Output topic (MpcState message)
    output_topic: "/mpc_state"
    
    # Rate at which to check for new messages (Hz)
    publish_rate_hz: 50.0
