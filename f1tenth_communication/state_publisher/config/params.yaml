# @file params.yaml
# @brief Runtime parameters for state_publisher node.
# @details Configures trajectory source, topic wiring, steering conversion,
#          and streamed-horizon behavior for Jetson-side MPC state publishing.
# @dependencies state_publisher/src/state_publisher.cpp
state_publisher:
  ros__parameters:
    # Path to trajectory CSV file (comma-delimited)
    # Format: s_m,x_m,y_m,psi_rad,kappa_radpm,vx_mps,ax_mps2
    trajectory_file: "/ros2_ws/src/f1tenth_planning/trajectories/my_track_raceline.csv"
    
    # Input topic (localization output)
    odom_topic: "/ego_racecar/odom"

    # Pose trigger topic in map frame.
    # Each pose sample triggers one outgoing MpcState packet.
    pose_topic: "/ekf_pose"
    
    # Output topic (MpcState message)
    output_topic: "/mpc_state"
    
    # Servo position feedback topic (for actual steering angle)
    # On real car: "/sensors/servo_position_command" from VESC
    # Set to "" to disable and use bicycle-model estimate instead
    servo_topic: "/sensors/servo_position_command"
    
    # Vehicle wheelbase [m] (used for steering angle estimation fallback)
    wheelbase: 0.324   # [m] (matches MPC/FPGA VP_WHEELBASE)
    
    # VESC servo → steering angle conversion
    # Forward: servo = gain * (c2·|δ|² + c1·|δ| + c0) + offset
    # Inverse (feedback): solve quadratic to recover δ
    servo_gain: -0.7284    # [servo_units / rad]
    servo_offset: 0.55     # servo center value (δ=0)
    steering_correction_c2: 0.589566   # Polynomial correction (calibrated 2026-03-12)
    steering_correction_c1: 0.918061
    steering_correction_c0: 0.001490
    
    # Forward-biased waypoint lookup: number of waypoints ahead of KD-tree
    # nearest to check.  Prevents selecting a waypoint behind the car at speed.
    forward_lookahead: 3

    # Default lateral bounds used when trajectory CSV does not provide
    # per-waypoint bound columns.
    default_left_bound: 2.0
    default_right_bound: 2.0

    # Number of reference waypoints to stream in each MpcState message.
    # Current FPGA bitstream expects fixed horizon=10.
    horizon: 10
