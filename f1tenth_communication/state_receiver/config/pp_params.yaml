# Pure Pursuit FPGA Configuration
# For use with pp_receiver_node

pp_receiver:
  ros__parameters:
    # Input/Output topics
    input_topic: "/mpc_state"
    drive_topic: "/drive"
    
    # Trajectory file (path to raceline CSV)
    trajectory_file: ""  # Must be set at launch!
    
    # Lookahead horizon (number of waypoints to send to FPGA)
    horizon: 10
    
    # FPGA settings
    use_fpga: true                   # Set false for software fallback
    fpga_base_address: 0xA0000000    # PL base address (from Vivado)
    
    # Pure Pursuit parameters
    min_lookahead: 0.5    # [m] Minimum lookahead distance
    max_lookahead: 2.0    # [m] Maximum lookahead distance
    lookahead_gain: 0.3   # [1/s] Lookahead = min + gain * velocity
    
    # Vehicle parameters
    wheelbase: 0.3302      # [m] Distance between front and rear axles
    max_steering: 0.4189    # [rad] Maximum steering angle (~24 degrees)
    max_velocity: 6.0     # [m/s] Maximum velocity command
