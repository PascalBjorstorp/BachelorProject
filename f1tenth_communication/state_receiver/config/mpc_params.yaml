# MPC Receiver — FPGA Riccati-ADMM Configuration
# For use with mpc_receiver_node on Ultra96-V2

mpc_receiver:
  ros__parameters:
    # Topics
    input_topic: "/mpc_state"
    drive_topic: "/drive"

    # Optional fallback trajectory CSV.
    # Only used when use_fpga=false or if FPGA init fails and SW fallback is active.
    trajectory_file: ""

    # FPGA settings
    use_fpga: true                    # false → software Frenet fallback
    fpga_base_address: 0xA0000000     # PL base addr (Vivado Address Editor)

    # Vehicle parameters
    max_steering: 0.4189    # ~24 degrees [rad]
    max_velocity: 12.0       # [m/s]
    wheelbase: 0.324        # [m] (matches MPC/FPGA VP_WHEELBASE)
    track_half_width: 2.0   # Default track bound distance [m]

    # Software fallback gains (used when FPGA unavailable)
    K_ey: 1.0
    K_epsi: 1.5
    K_slowdown: 0.5

    # Control interval for speed integration: speed = vx + accel × dt
    # Should match the state_publisher publish rate (default 50 Hz → 0.02 s)
    control_dt: 0.02  # [s]

    # Safety watchdog: zero drive command if no state received within this timeout
    watchdog_timeout_ms: 100.0  # [ms]
