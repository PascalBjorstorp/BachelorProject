# MPC Receiver (software Frenet controller) — test/fallback
mpc_receiver_mpc:
  ros__parameters:
    # Trajectory CSV (must match state_publisher's file)
    # Format: s_m,x_m,y_m,psi_rad,kappa_radpm,vx_mps,ax_mps2
    trajectory_file: ""  # Must be set at launch!

    # Topics
    input_topic: "/mpc_state"
    drive_topic: "/drive"

    # MPC prediction horizon (waypoints ahead)
    horizon: 20

    # Proportional controller gains
    K_ey: 1.0           # Lateral error gain [rad/m]
    K_epsi: 1.5         # Heading error gain [rad/rad]
    K_slowdown: 0.5     # Slowdown factor for large CTE [1/m]

    # Vehicle limits
    max_steering: 0.4189    # ~24 degrees [rad]
    max_velocity: 6.0       # [m/s]
    wheelbase: 0.3302       # [m]

    # Control interval for acceleration estimate
    control_dt: 0.02        # [s]
