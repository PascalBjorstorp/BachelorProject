# GPU AMCL Configuration
# 
# This file contains all parameters for the GPU-accelerated AMCL node.
# Parameters follow the same naming as nav2_amcl where applicable.

gpu_amcl:
  ros__parameters:
    # =========================================================================
    # General Settings
    # =========================================================================
    
    # Enable GPU acceleration (requires CuPy)
    # Set to false for CPU-only operation (useful for debugging)
    use_gpu: true
    
    # =========================================================================
    # Particle Filter Settings
    # =========================================================================
    
    # Number of particles (trade-off: more = better accuracy, slower)
    # Recommendations:
    #   - Jetson Nano: 500-1000
    #   - Jetson Xavier/Orin: 2000-5000
    #   - Desktop GPU: 5000-10000
    num_particles: 2000
    min_particles: 100
    max_particles: 5000
    
    # Resample when effective particle count drops below this ratio
    # Lower = resample less often (faster but may diverge)
    resample_threshold: 0.5
    
    # =========================================================================
    # Frame IDs (must match your robot's TF tree)
    # =========================================================================
    
    global_frame_id: 'map'
    odom_frame_id: 'odom'
    base_frame_id: 'ego_racecar/base_link'
    
    # =========================================================================
    # Topics
    # =========================================================================
    
    scan_topic: '/scan'
    odom_topic: '/odom'
    
    # =========================================================================
    # Update Thresholds
    # =========================================================================
    
    # Minimum motion before filter update
    # Lower = update more frequently (more accurate but slower)
    update_min_d: 0.01    # Translation (meters)
    update_min_a: 0.02    # Rotation (radians)
    
    # =========================================================================
    # Motion Model (Odometry Noise)
    # =========================================================================
    
    # Alpha parameters from Probabilistic Robotics
    # Higher values = more uncertainty in odometry
    # Tune based on your robot's odometry quality
    alpha1: 0.2   # Rotation noise from rotation
    alpha2: 0.2   # Rotation noise from translation
    alpha3: 0.2   # Translation noise from translation
    alpha4: 0.2   # Translation noise from rotation
    
    # =========================================================================
    # IMU Fusion (for high-speed driving)
    # =========================================================================
    
    # IMU topic from VESC (sensor_msgs/Imu)
    imu_topic: '/sensors/imu/raw'
    
    # Enable gyroscope fusion for rotation estimates
    # Use this for high-speed driving where wheel slip causes odometry drift
    use_imu_rotation: true
    
    # Weight for IMU vs odometry rotation (0.0 = only odom, 1.0 = only IMU)
    # Higher = trust IMU more (recommended for high speed)
    imu_gyro_weight: 0.8
    
    # =========================================================================
    # Slip Detection (for aggressive driving)
    # =========================================================================
    
    # Enable slip detection using IMU accelerometer
    use_slip_detection: true
    
    # Forward acceleration difference to trigger slip (m/s²)
    # Lower = more sensitive, higher = less false positives
    slip_threshold: 0.5
    
    # Lateral acceleration to trigger slip (m/s²)
    # Detects drifting/sliding during cornering
    slip_lateral_threshold: 0.3
    
    # Motion model noise multiplier when slip detected
    # Higher = more uncertainty during slip (spreads particles more)
    slip_noise_multiplier: 2.0
    
    # =========================================================================
    # Sensor Model (Laser Likelihood)
    # =========================================================================
    
    # Maximum beams to use (subsampled from full scan)
    # More beams = better accuracy but slower
    # UST-10LX has 1080 beams, 60-120 is usually sufficient
    max_beams: 60
    
    # Laser max range (meters)
    # UST-10LX typical max range is 10m
    laser_max_range: 10.0
    
    # Likelihood model mixing weights (should sum to 1.0)
    z_hit: 0.95      # Weight for correct readings
    z_rand: 0.05     # Weight for random noise
    
    # Standard deviation for hit model (meters)
    # Controls how "tight" the match must be
    sigma_hit: 0.2
    
    # Laser position relative to base_link
    # Measure from rear axle center to laser center
    laser_offset_x: 0.275   # Forward (meters)
    laser_offset_y: 0.0     # Left (positive) (meters)
    
    # =========================================================================
    # Initial Pose
    # =========================================================================
    
    # Default initial pose (used if no /initialpose received)
    initial_pose_x: 0.0
    initial_pose_y: 0.0
    initial_pose_a: 0.0    # Yaw in radians
    
    # Initial covariance (spread of initial particles)
    initial_cov_xx: 0.5    # x variance
    initial_cov_yy: 0.5    # y variance
    initial_cov_aa: 0.2    # yaw variance
    
    # =========================================================================
    # Publishing
    # =========================================================================
    
    # Rate at which to publish pose and TF (Hz)
    # Set to 40Hz to match LiDAR rate for high-speed racing
    publish_rate: 40.0
    
    # TF timestamp tolerance (seconds)
    transform_tolerance: 0.1
