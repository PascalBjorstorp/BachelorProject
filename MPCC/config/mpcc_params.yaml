# MPCC Configuration Parameters — Liniger-style Path Generation
# Global Frame Liniger MPCC (7-state) with centerline reference
#
# State [7]: s, vx, vy, omega, X, Y, psi
# Control [3]: delta, a_x, v_theta
#
# Mode: Centerline reference with low contouring / high progress
#        MPCC generates its own racing line within track bounds
#
# Usage: ros2 launch mpcc_f1_10th mpcc_launch.py
# Override: ros2 launch mpcc_f1_10th mpcc_launch.py weight_contouring:=50.0

mpcc_node:
  ros__parameters:

    # --- Prediction Horizon (best configuration) ---
    horizon_steps: 20
    dt: 0.05              # [seconds] time step between prediction stages

    # --- Contouring Weights ---
    # weight_contouring: penalizes perpendicular distance from centerline
    #   LOW value → MPCC can deviate from centerline to find faster path
    # weight_lag: penalizes tangential distance (keeps s synced to position)
    # weight_progress: reward for forward progress (-q_s * v_theta)
    #   HIGH value → MPCC aggressively maximizes speed along track
    weight_contouring: 960.0      # contouring error penalty
    weight_lag: 100.0             # lag error penalty
    weight_progress: 15.6         # progress reward

    # --- State Regularization ---
    weight_vx: 30.0       # longitudinal velocity tracking weight
    vx_ref: 4.0           # [m/s] reference velocity
    weight_vy: 0.5        # lateral velocity penalty
    weight_omega: 3.0     # yaw rate penalty

    # --- Control Effort ---
    weight_delta: 100.0   # steering magnitude penalty
    weight_ax: 0.05225    # acceleration magnitude penalty
    weight_v_theta: 0.1   # progress rate penalty

    # --- Control Smoothness (rate penalties) ---
    weight_delta_rate: 2.0       # steering-rate smoothing
    weight_ax_rate: 0.488        # acceleration rate
    weight_v_theta_rate: 0.1105  # progress acceleration rate

    # --- Terminal Cost ---
    weight_contouring_terminal: 4800.0
    weight_lag_terminal: 800.0
    weight_progress_terminal: 41.4

    # --- Obstacle Avoidance ---
    weight_obstacle: 1000.0   # penalty for ellipsoidal constraint violation
    obstacle_margin: 0.1      # [m] safety margin added to obstacles

    # --- ADMM Solver ---
    admm_rho: 5.0         # penalty parameter
    admm_max_iterations: 300
    admm_tolerance: 0.02      # convergence tolerance

    # --- Constraint Bounds ---
    delta_max: 0.4189     # [rad] max steering angle
    ax_max: 7.0           # [m/s^2] max longitudinal acceleration
    ax_min: -10.0         # [m/s^2] max braking deceleration
    vx_max: 20.0          # [m/s] max longitudinal velocity
    vx_min: 0.0           # [m/s] min longitudinal velocity
    n_max: 0.5            # [m] default track half-width
    v_theta_max: 15.0    # [m/s] max progress rate

    # --- Tire Parameters ---
    mu: 0.745             # [-] road-tire friction coefficient
    C_Sf: 4.297           # [1/rad] front normalized cornering stiffness
    C_Sr: 3.473           # [1/rad] rear normalized cornering stiffness

    # --- ROS2 Topics ---
    odom_topic: "/odom"
    drive_topic: "/drive"
    path_topic: "/reference_path"
    obstacle_topic: "/obstacles"
    predicted_path_topic: "/mpcc/predicted_path"
